name: Feature request
description: Suggest a new feature or a change of behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need to do on the mainframe, and why does the current behaviour not allow it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: reference
    attributes:
      label: Behaviour in other emulators
      description: If x3270 / wc3270 or another 3270 emulator already does this, describe how (or link its documentation).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web gateway / web client
        - Desktop client
        - Both
        - Deployment
    validations:
      required: true
