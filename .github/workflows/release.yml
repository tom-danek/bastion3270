# Release builds of the desktop client and the gateway. Runs only when a version tag is pushed
# (`git tag -a v0.1.0 -m "bastion3270 0.1.0" && git push origin v0.1.0`), never on normal pushes.
# Started by hand (Actions → release → Run workflow) it builds and keeps the archives as workflow
# artifacts without creating a release — a dry run.
#
# * The tag must match the workspace version in `Cargo.toml`.
# * Each platform builds on its own native runner and also runs the tests of the crates the client
#   is made of, so the client is tested on Windows and macOS too, not only on Linux.
# * Release builds start from a clean state (no build cache), so a cache entry can never end up
#   in a shipped binary.
# * Every archive contains THIRD_PARTY_LICENSES: the licence texts of all third-party crates in
#   the binary (cargo-about, `about.toml`), as their licences require for binary distribution.
# * Every platform gets a CycloneDX SBOM (`*.cdx.json`, cargo-cyclonedx) as a release asset.
# * The gateway is built by the container build (`docker/Dockerfile.server`) on a native runner
#   per architecture: the static binary of the release archive is the binary of the image. On a
#   tag the image is pushed to ghcr.io with an SBOM and build provenance, and both
#   architectures are joined under the version tag and `latest`.
# * Every release asset and the image get a signed build provenance attestation (GitHub artifact
#   attestations, Sigstore): `gh attestation verify <file> --repo tom-danek/bastion3270`. The
#   assets are attested in a dry run too, so that step is tested before a tag relies on it.
# * The result is a draft release with the archives, the SBOMs and `SHA256SUMS`; it is published
#   by hand after the notes have been read.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Licence texts and SBOMs come from Cargo.lock alone (no build): one job for all platforms.
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Tools
        run: |
          cargo install --locked cargo-about --version 0.9.3 --features cli
          cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: Third-party licences
        run: |
          mkdir -p notices notices-gateway sbom
          cargo about generate --locked -m crates/bastion3270-gui/Cargo.toml about.hbs \
            -o notices/THIRD_PARTY_LICENSES
          cargo about generate --locked -m crates/bastion3270-server/Cargo.toml about.hbs \
            -o notices-gateway/THIRD_PARTY_LICENSES
      - name: SBOMs
        # One per platform of the build matrices below (keep the lists in step).
        run: |
          sbom() {  # crate, target, platform
            cargo cyclonedx -q -f json --spec-version 1.5 --describe binaries --no-build-deps \
              --target "$2" --manifest-path "crates/$1/Cargo.toml"
            mv "crates/$1/$1_bin.cdx.json" "sbom/$1-${GITHUB_REF_NAME}-$3.cdx.json"
            find crates -name '*.cdx.json' -delete
          }
          sbom bastion3270-gui x86_64-unknown-linux-gnu linux-x86_64
          sbom bastion3270-gui x86_64-pc-windows-msvc windows-x86_64
          sbom bastion3270-gui aarch64-apple-darwin macos-arm64
          sbom bastion3270-server x86_64-unknown-linux-musl linux-x86_64
          sbom bastion3270-server aarch64-unknown-linux-musl linux-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: notices/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-gateway
          path: notices-gateway/*
          if-no-files-found: error
      # Release assets are the artifacts named `asset-*`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-sbom
          path: sbom/*
          if-no-files-found: error

  build:
    needs: notices
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linked with zig against glibc 2.28 (the `.2.28` suffix of cargo-zigbuild), whatever the
          # runner's glibc: the binary runs on RHEL 8 / 9 and their rebuilds, SLES 15, Debian 11+,
          # Ubuntu 20.04+. Checked below by symbol versions and by starting it on Rocky Linux.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            glibc: "2.28"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    # A normal build takes 5–15 minutes per platform.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Oldest macOS release the binary runs on.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
      - name: Desktop client build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Tests
        # --no-fail-fast: one run shows every failing test binary, not only the first.
        run: cargo test --locked --no-fail-fast -p bastion3270-core -p bastion3270-net -p bastion3270-gui
      # Zig from its official download (pinned version and checksum) as the linker, driven by
      # cargo-zigbuild. Ubuntu's glibc headers are not used, so they cannot mix with zig's.
      - name: Zig linker
        if: matrix.glibc
        run: |
          zig=zig-x86_64-linux-0.17.1
          curl -fsSLO "https://ziglang.org/download/0.17.1/$zig.tar.xz"
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  $zig.tar.xz" | sha256sum -c
          tar -xJf "$zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.24.1
      - name: Build
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --locked --release -p bastion3270-gui --target "${{ matrix.target }}.${{ matrix.glibc }}"
          else
            cargo build --locked --release -p bastion3270-gui --target ${{ matrix.target }}
          fi
      # No symbol newer than the promised glibc, and the client opens its window on the oldest
      # and on the current RHEL release, as Rocky Linux (Xvfb, Mesa software rendering).
      - name: Runs on older distributions
        if: matrix.glibc
        run: |
          bin="target/${{ matrix.target }}/release/bastion3270-gui"
          newest=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          highest=$(printf '%s\n' "$newest" "GLIBC_${{ matrix.glibc }}" | sort -V | tail -1)
          if [ "$highest" != "GLIBC_${{ matrix.glibc }}" ]; then
            echo "::error::the client needs $newest, more than glibc ${{ matrix.glibc }}"
            exit 1
          fi
          for image in docker.io/rockylinux/rockylinux:8 docker.io/rockylinux/rockylinux:9; do
            echo "::group::$image"
            tools/desktop-smoke.sh "$bin" "$image"
            echo "::endgroup::"
          done
      # Linux: binary in a .tar.gz. Windows: .exe in a .zip. macOS: an application bundle
      # (bastion3270.app, so a double click does not open a Terminal window) with its icon, in a
      # .zip made by `ditto`, which keeps the bundle's metadata. The bundle gets an ad-hoc signature: not a
      # trusted identity, but it seals the bundle so macOS does not report it as damaged.
      - name: Package
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          name="bastion3270-gui-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          bin="target/${{ matrix.target }}/release/bastion3270-gui"
          mkdir -p "dist/$name"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES notices/THIRD_PARTY_LICENSES README.md "dist/$name/"
          case "$RUNNER_OS" in
            Linux)
              cp "$bin" "dist/$name/"
              tar -czf "dist/$name.tar.gz" -C dist "$name"
              ;;
            Windows)
              cp "$bin.exe" "dist/$name/"
              (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
              ;;
            macOS)
              app="dist/$name/bastion3270.app"
              mkdir -p "$app/Contents/MacOS"
              cp "$bin" "$app/Contents/MacOS/"
              # The bundle's icon (Finder, Launchpad): every size of an .iconset, from the
              # 512-pixel PNG of the web client.
              iconset="$RUNNER_TEMP/bastion3270.iconset"
              mkdir -p "$iconset" "$app/Contents/Resources"
              for size in 16 32 128 256 512; do
                sips -z "$size" "$size" crates/bastion3270-server/web/icon-512.png \
                  --out "$iconset/icon_${size}x${size}.png" > /dev/null
                if [ "$size" -le 256 ]; then
                  double=$((size * 2))
                  sips -z "$double" "$double" crates/bastion3270-server/web/icon-512.png \
                    --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
                fi
              done
              iconutil -c icns "$iconset" -o "$app/Contents/Resources/bastion3270.icns"
              sed "s/@VERSION@/$version/g" crates/bastion3270-gui/macos/Info.plist > "$app/Contents/Info.plist"
              plutil -lint "$app/Contents/Info.plist"
              codesign --force --sign - "$app"
              codesign --verify --strict "$app"
              ditto -c -k --keepParent "dist/$name" "dist/$name.zip"
              ;;
          esac
          rm -r "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # The gateway: the container build on a native runner per architecture. Its `binary` stage is
  # the release archive; on a tag the same build is pushed as the image of that architecture.
  gateway:
    needs: notices
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/bastion3270-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices-gateway
          path: notices
      - name: Tag matches the crate version and the image of the examples
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          # The quick start, the Kubernetes example and the README use the image of this release.
          grep -q "image: ghcr.io/.*/bastion3270-server:$version\$" docker/docker-compose.yml \
            || { echo "::error::docker/docker-compose.yml does not use the image $version"; exit 1; }
          grep -q "newTag: $version\$" deploy/k8s/kustomization.yaml \
            || { echo "::error::deploy/k8s/kustomization.yaml does not use the image $version"; exit 1; }
          grep -q "docker pull ghcr.io/.*/bastion3270-server:$version " README.md \
            || { echo "::error::README.md does not pull the image $version"; exit 1; }
      # A BuildKit builder of its own: keeps the build stage between the binary and the image,
      # and can attach an SBOM and provenance to the image.
      - name: Builder
        run: docker buildx create --use --name release --driver docker-container
      - name: Binary
        run: |
          docker buildx build --platform "linux/${{ matrix.arch }}" -f docker/Dockerfile.server \
            --target binary --output type=local,dest=out .
          file out/bastion3270-server
          out/bastion3270-server --check-config docker/bastion3270-server.toml
      - name: Package
        run: |
          name="bastion3270-server-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp out/bastion3270-server LICENSE NOTICE THIRD_PARTY_NOTICES notices/THIRD_PARTY_LICENSES \
            README.md "dist/$name/"
          cp docker/bastion3270-server.toml "dist/$name/bastion3270-server.example.toml"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -r "dist/$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-gateway-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - name: Image of this architecture
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform "linux/${{ matrix.arch }}" -f docker/Dockerfile.server \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --sbom=true --provenance=mode=max --metadata-file meta.json \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" .
          mkdir -p digests
          digest=$(jq -r '."containerimage.digest"' meta.json)
          touch "digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: digests-${{ matrix.platform }}
          path: digests/*
          if-no-files-found: error

  # One image for both architectures under the version and `latest`, with a signed build
  # provenance attestation (GitHub artifact attestations, Sigstore) pushed next to it.
  image:
    if: startsWith(github.ref, 'refs/tags/')
    needs: gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write       # the Sigstore signing certificate
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/bastion3270-server
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - name: Multi-architecture image
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version=${GITHUB_REF_NAME#v}
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=TN3270 web gateway: runs 3270 sessions on the server and serves a browser client" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "index:org.opencontainers.image.version=$version" \
            -t "$IMAGE:$version" -t "$IMAGE:latest" \
            $(for d in digests/*; do printf '%s@sha256:%s ' "$IMAGE" "$(basename "$d")"; done)
          docker buildx imagetools inspect "$IMAGE:$version"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Provenance attestation of the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://$IMAGE:${GITHUB_REF_NAME#v}" --repo "$GITHUB_REPOSITORY"

  # SHA256SUMS of every release asset and one signed build provenance attestation for all of
  # them; also in a dry run, so the step is exercised before a tag needs it.
  attest:
    needs: [notices, build, gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # the Sigstore signing certificate
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Provenance attestation of the assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Verify the attestation
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in $(cut -d' ' -f3 SHA256SUMS); do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" > /dev/null
            echo "verified: $f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    # Not on the image: the archives are released even if the image push failed.
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asset-*
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
            --title "bastion3270 ${GITHUB_REF_NAME#v}"
