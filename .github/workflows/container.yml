# The gateway's container image, built and started whenever one of its own inputs changes: the
# Dockerfile with its pinned base image (also the update proposals of Dependabot), the build
# context rules and the locked dependencies (the static musl build). Code changes are covered by
# ci.yml; the release workflow builds the image from the same Dockerfile.
name: container

on:
  push:
    branches: [main]
    paths: [docker/Dockerfile.server, .dockerignore, Cargo.lock, .github/workflows/container.yml]
  pull_request:
    paths: [docker/Dockerfile.server, .dockerignore, Cargo.lock, .github/workflows/container.yml]
  workflow_dispatch:

concurrency:
  group: container-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f docker/Dockerfile.server -t bastion3270-server:ci .
      # The image starts as a non-root user with the example configuration mounted, and the
      # HEALTHCHECK of the Dockerfile reports it healthy.
      - name: Start
        run: |
          docker run -d --name gateway -p 127.0.0.1:8080:8080 \
            -v "$PWD/docker/bastion3270-server.toml:/etc/bastion3270/bastion3270-server.toml:ro" \
            bastion3270-server:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' gateway)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' gateway)" = true ] || break
            sleep 2
          done
          docker logs gateway
          [ "$status" = healthy ] || { echo "::error::the container is not healthy: $status"; exit 1; }
          curl -fsS http://127.0.0.1:8080/healthz
