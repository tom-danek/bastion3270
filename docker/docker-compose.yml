# Local stack: Hercules MVS 3.8j + the bastion3270-server gateway (the published image).
#
#   podman-compose -f docker/docker-compose.yml up -d      (or: docker compose …)
#   → http://127.0.0.1:8080
#
# The gateway built from this checkout instead: add docker/docker-compose.build.yml.
#
# Only the Hercules service is needed for desktop GUI development:
#   podman-compose -f docker/docker-compose.yml up -d hercules-tk4
services:
  hercules-tk4:
    # MVS 3.8j TK4- Update 08 with Hercules; pinned, because `latest` is rebuilt.
    image: docker.io/rattydave/docker-ubuntu-hercules-mvs@sha256:13b053388b37a10812d00316659b5faa36939d44b78197dd86f6e4cdc20fde2a
    platform: linux/amd64
    container_name: bastion3270-hercules
    networks:
      mainframe:
        aliases: [hercules]     # bastion3270-server.toml: host = "hercules"
    ports:
      - "127.0.0.1:3270:3270"   # TN3270 terminal port
      - "127.0.0.1:8038:8038"   # Hercules HTTP web console
    restart: unless-stopped

  bastion3270-server:
    # The release of this version (the release workflow checks that the tag matches).
    image: ghcr.io/tom-danek/bastion3270-server:0.1.1
    container_name: bastion3270-server
    networks: [mainframe]
    depends_on: [hercules-tk4]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./bastion3270-server.toml:/etc/bastion3270/bastion3270-server.toml:ro
    environment:
      RUST_LOG: info
      BASTION3270_LOG_FORMAT: text
    # Same hardening as the Kubernetes securityContext.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  mainframe: {}
